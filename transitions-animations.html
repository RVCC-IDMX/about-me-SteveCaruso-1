<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions & Animations</title>
</head>
<body>

<h1>Transitions, Transforms & Animations</h1>

<div id="example">Example Div</div>

<ul>
    <li>One</li>
    <li>Two</li>
    <li>Three</li>
    <li>Four</li>
</ul>

<style>
ul {
    list-style: none;
    display:flex;
    align-items:flex-end;
    border:1px solid gray;
    justify-content: center;
    height:50px;
}
ul li {
    border-bottom:1px solid white;
}
ul li:hover {
    margin-left:1ex;
    border-bottom:1px solid black;
    padding-top:1ex;
    padding-bottom:1ex;
}

#example {
    border:2px solid black;
    width:100px;
    height:100px;
    align-content:center;
    text-align:center;
    margin-left:auto;
    margin-right:auto;
    transition-duration:1s;
    transition-timing-function:ease-in-out;
    /*cubic-bezier(1, -0.539, 1, 0.053);*/
}
#example:hover {
    background-color:red;
    transition-duration:1s;
    /*border-left:400px solid black;*/
    /*margin-left:400px;*/
    border-radius:100px;

    transition-delay:.5s;

    transform:rotateZ(90deg) translateX(100px)   ;
}

</style>

<div id="anim">Animation</div>

<style>
/* Animations */

#anim {
    border:2px solid black;
    width:100px;
    height:100px;
    align-content:center;
    text-align:center;
    margin-left:auto;
    margin-right:auto;
    animation-name: basicAnim;
    animation-duration:1.5s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    animation-timing-function: steps(5);
}
#anim:hover {
    animation-play-state: running;
}

@keyframes basicAnim {
    0% {
        background-color:blue;
    }
    50% {
        background-color:white;
    }
    100% {
        background-color:red;
    }
}


</style>

</body>
</html>
